[pytest]
# Look for tests only in tests/.
testpaths = tests
# Don't create a .pytest_cache folder in the project.
addopts = -p no:cacheprovider
# If any single test runs longer than 60 s (e.g. Qt audio freezes), print every
# thread's traceback and stop the run, instead of hanging forever.
faulthandler_timeout = 60
faulthandler_exit_on_timeout = true
